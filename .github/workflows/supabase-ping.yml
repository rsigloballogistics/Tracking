name: Supabase Daily Keep-Alive

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger it manually anytime for testing

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Supabase Client
        run: pip install supabase

      - name: Run Database Ping Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import os
          from supabase import create_client
          url = os.environ.get('SUPABASE_URL')
          key = os.environ.get('SUPABASE_KEY')
          supabase = create_client(url, key)
          
          # Query one of your newly created tables to generate activity
          response = supabase.table('table1').select('slno').limit(1).execute()
          print('Keep-alive ping successful:', response)
          "
